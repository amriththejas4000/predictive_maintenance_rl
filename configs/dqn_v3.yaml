# DQN Configuration - Experiment 3
# Run: python3 train.py --config configs/dqn_v3.yaml

experiment:
  run_id: run3
  description: "Final tuned config - optimal parameters"

environment:
  max_steps: 365

model:
  algorithm: DQN
  policy: MlpPolicy
  learning_rate: 0.002
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 128
  gamma: 0.99
  train_freq: 4
  target_update_interval: 300
  net_arch: [256, 256]

exploration:
  exploration_fraction: 0.3
  exploration_final_eps: 0.05

training:
  total_timesteps: 100000
  eval_freq: 5000
  n_eval_episodes: 10

logging:
  log_path: ./logs/
  model_save_path: ./models/
  results_path: ./experiments/results.csv
  