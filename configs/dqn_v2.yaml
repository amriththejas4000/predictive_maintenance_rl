# DQN Configuration - Experiment 2
# Run: python3 train.py --config configs/dqn_v2.yaml

experiment:
  run_id: run2
  description: "Lower learning rate experiment - slower but stable learning"

environment:
  max_steps: 365

model:
  algorithm: DQN
  policy: MlpPolicy
  learning_rate: 0.0005
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 64
  gamma: 0.95
  train_freq: 4
  target_update_interval: 500
  net_arch: [128, 128]

exploration:
  exploration_fraction: 0.4
  exploration_final_eps: 0.1

training:
  total_timesteps: 100000
  eval_freq: 5000
  n_eval_episodes: 10

logging:
  log_path: ./logs/
  model_save_path: ./models/
  results_path: ./experiments/results.csv